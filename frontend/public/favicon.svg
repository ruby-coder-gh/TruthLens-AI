<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Outer eye -->
  <ellipse cx="24" cy="24" rx="20" ry="14" stroke="url(#f-grad)" stroke-width="2" fill="none"/>
  <!-- Iris -->
  <circle cx="24" cy="24" r="9" fill="url(#f-grad)" opacity="0.85"/>
  <!-- Pupil -->
  <circle cx="24" cy="24" r="4.5" fill="#080b12"/>
  <!-- Specular -->
  <ellipse cx="20" cy="19" rx="3.5" ry="2" fill="white" opacity="0.5" transform="rotate(-20 20 19)"/>
  <!-- Lens reticle marks -->
  <line x1="24" y1="10" x2="24" y2="13" stroke="url(#f-grad)" stroke-width="1" opacity="0.4"/>
  <line x1="24" y1="35" x2="24" y2="38" stroke="url(#f-grad)" stroke-width="1" opacity="0.4"/>
  <line x1="4" y1="24" x2="7" y2="24" stroke="url(#f-grad)" stroke-width="1" opacity="0.4"/>
  <line x1="41" y1="24" x2="44" y2="24" stroke="url(#f-grad)" stroke-width="1" opacity="0.4"/>
  <defs>
    <linearGradient id="f-grad" x1="4" y1="6" x2="44" y2="42">
      <stop stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
</svg>
