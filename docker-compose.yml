version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: veritasrag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  model-init:
    image: ollama/ollama:latest
    container_name: veritasrag-init
    entrypoint: ["/bin/sh", "-c"]
    command: |
      echo "Waiting for Ollama..." && \
      until ollama list >/dev/null 2>&1; do sleep 2; done && \
      echo "Pulling models..." && \
      ollama pull ${OLLAMA_PRIMARY_MODEL:-qwen3:4b} && \
      ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text} && \
      if [ "${MULTIMODAL_ENABLED:-true}" = "true" ]; then \
        ollama pull ${OLLAMA_VISION_MODEL:-llava:7b}; \
      fi && \
      echo "All models ready" && \
      touch /models_ready
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build: ./backend
    container_name: veritasrag-api
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      - APP_ENV=production
      - DB_URL=sqlite+aiosqlite:///data/truthlens.db
      - CHROMA_PERSIST_DIR=/data/chromadb
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_PRIMARY_MODEL=${OLLAMA_PRIMARY_MODEL:-qwen3:4b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - MULTIMODAL_ENABLED=${MULTIMODAL_ENABLED:-true}
    volumes:
      - app_data:/data
    depends_on:
      model-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  app_data:
  ollama_data:
