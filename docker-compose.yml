version: "3.9"

services:
  app:
    build: ./backend
    container_name: veritasrag-api
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      - APP_ENV=production
      - DB_URL=sqlite+aiosqlite:///data/truthlens.db
      - CHROMA_PERSIST_DIR=/data/chromadb
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - app_data:/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    container_name: veritasrag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  app_data:
  ollama_data:
