name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly golden-set eval regression at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Push/PR only — keep the nightly eval cron from re-running the full suite.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ tests/

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports

      - name: Run tests
        run: |
          python -m pytest tests/ -x --tb=short -q --cov=app --cov-fail-under=70

      - name: Security scan
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt

  docker:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t veritasrag ./backend

  frontend:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npm exec tsc -- --noEmit

  eval-regression:
    # Nightly / manual only — the full golden-set eval needs Ollama and is far
    # too slow for every push/PR. Skipped on push and pull_request events.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    env:
      EVAL_RUN: "1"
      APP_SECRET_KEY: ${{ secrets.EVAL_APP_SECRET_KEY }}
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_PRIMARY_MODEL: qwen3:4b
      OLLAMA_FALLBACK_MODEL: qwen3:4b

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Wait for Ollama and pull model
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then
              echo "Ollama is up"; break
            fi
            echo "Waiting for Ollama... ($i)"; sleep 2
          done
          curl -sf http://localhost:11434/api/pull -d '{"name": "qwen3:4b"}'

      - name: Run golden-set eval regression (slow)
        run: |
          python -m pytest -m slow tests/test_evaluation/test_golden_regression.py -v --tb=short
