[project]
name = "veritasrag"
version = "0.1.0"
description = "Offline-first RAG platform — grounded, cited, confidence-scored answers over private documents."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.0",
    "pydantic-settings==2.3.0",
    "python-multipart==0.0.9",
    "sqlalchemy[asyncio]==2.0.30",
    "aiosqlite==0.20.0",
    "alembic==1.13.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt<4.1",  # passlib 1.7.4 reads bcrypt.__about__.__version__, removed in bcrypt 4.1+
    "langchain==0.2.0",
    "langchain-community==0.2.0",
    "langgraph==0.2.0",
    "langchain-ollama==0.1.0",
    "chromadb==0.5.0",
    "sentence-transformers==3.0.0",
    "rank-bm25==0.2.2",
    "transformers==4.41.0",
    "torch==2.3.0",
    "structlog==24.1.0",
    "tenacity==8.3.0",
    "python-dateutil==2.9.0",
    "filetype==1.2.0",
    "PyMuPDF==1.24.0",
    "python-docx==1.1.0",
    "markdown==3.6.0",
    "httpx==0.27.0",
    "anyio==4.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async",
    "slow: full golden-set eval, needs Ollama (opt-in via EVAL_RUN=1)",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async engine runs DB calls inside greenlets; without tracing
# through them, coverage under-counts every line after the first `await`
# database call in a request handler. Trace threads + greenlets so coverage
# reflects what the async endpoints actually execute.
concurrency = ["thread", "greenlet"]
